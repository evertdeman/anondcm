[project]
name = "anondcm"
version = "0.3.0"
description = "A tool to anonymize your DICOM files."
authors = [
    {name = "Evert de Man"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydicom>=2",
]

[project.urls]
Homepage = "https://github.com/evertdeman/anondcm"
Issues = "https://github.com/evertdeman/anondcm/issues"

[project.scripts]
anondcm = "anondcm.__main__:cli"

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]
release = ["python-semantic-release==9.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anondcm"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::anondcm.anonymizer.PixelDataWarning",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
# The distribution is built and published by the `publish` job in
# .github/workflows/versioning.yml (semantic-release's container has no uv).
build_command = ""
tag_format = "{version}"

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }
type = "github"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false
